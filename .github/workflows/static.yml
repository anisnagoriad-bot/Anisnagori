        // ROLE-BASED ACCESS CONTROL (RBAC) CONTROLLER
        function switchRole(role) {
            currentRole = role;
            const badge = document.getElementById('roleBadge');
            const adminDash = document.getElementById('adminStaffDashboard');
            const clientPortal = document.getElementById('clientPortalView');

            // Hide/Show Role Specific UI Elements
            const adminOnlyElements = document.querySelectorAll('.admin-only');
            const adminStaffElements = document.querySelectorAll('.admin-staff');

            if (role === 'admin') {
                badge.className = "text-xs bg-gold-500/20 text-gold-500 border border-gold-500/40 px-2 py-0.5 rounded font-normal";
                badge.innerHTML = "👑 Admin Role";
                
                adminDash.classList.remove('hidden');
                clientPortal.classList.add('hidden');

                adminOnlyElements.forEach(el => el.classList.remove('hidden'));
                adminStaffElements.forEach(el => el.classList.remove('hidden'));
            } 
            else if (role === 'staff') {
                badge.className = "text-xs bg-sky-500/20 text-sky-300 border border-sky-500/40 px-2 py-0.5 rounded font-normal";
                badge.innerHTML = "👨‍💼 Staff / Junior";

                adminDash.classList.remove('hidden');
                clientPortal.classList.add('hidden');

                adminOnlyElements.forEach(el => el.classList.add('hidden'));
                adminStaffElements.forEach(el => el.classList.remove('hidden'));
            } 
            else if (role === 'client') {
                badge.className = "text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 px-2 py-0.5 rounded font-normal";
                badge.innerHTML = "👤 Litigant / Client View";

                adminDash.classList.add('hidden');
                clientPortal.classList.remove('hidden');

                searchClientCases(); // Auto render client portal
            }

            renderTable(filteredCases); // Re-render table to toggle action buttons per role
        }

        // CLIENT PORTAL SEARCH & RENDER
        function searchClientCases() {
            const query = (document.getElementById('clientSearchInput').value || '').toLowerCase().trim();
            const container = document.getElementById('clientResultsContainer');
            const noResults = document.getElementById('clientNoResults');

            container.innerHTML = '';

            const matched = casesList.filter(c => {
                if (!query) return true; // Show all if empty query
                return (c.party && c.party.toLowerCase().includes(query)) ||
                       (c.caseNo && c.caseNo.toLowerCase().includes(query)) ||
                       (c.court && c.court.toLowerCase().includes(query));
            });

            if (matched.length === 0) {
                noResults.classList.remove('hidden');
                return;
            } else {
                noResults.classList.add('hidden');
            }

            matched.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-xl p-5 border border-slate-200 shadow-sm space-y-3 hover:border-gold-500/50 transition";
                
                const nextDateText = item.nextDate ? `<span class="bg-emerald-100 text-emerald-800 font-bold px-2.5 py-1 rounded-md text-xs border border-emerald-200">${item.nextDate}</span>` : `<span class="bg-amber-50 text-amber-700 font-medium px-2 py-0.5 rounded text-xs border border-amber-200">Awaiting Court Order</span>`;

                const msgUrl = `https://wa.me/919887642984?text=${encodeURIComponent(`Hello Advocate Anis Nagori, I need status update regarding my case: ${item.party} in Court ${item.court} (Case No. ${item.caseNo}).`)}`;

                card.innerHTML = `
                    <div class="flex items-start justify-between gap-2 border-b border-slate-100 pb-2">
                        <div>
                            <span class="text-xs font-semibold text-gold-600 uppercase tracking-wider">${item.court || 'Court'}</span>
                            <h3 class="font-bold text-slate-800 text-sm mt-0.5">${item.party}</h3>
                        </div>
                        <span class="text-xs font-mono bg-slate-100 px-2 py-1 rounded text-slate-600 whitespace-nowrap">Case: ${item.caseNo || 'N/A'}</span>
                    </div>

                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div class="bg-slate-50 p-2 rounded border border-slate-100">
                            <span class="text-slate-400 block text-[10px]">CURRENT STAGE</span>
                            <span class="font-bold text-navy-900">${item.stage || 'N/A'}</span>
                        </div>
                        <div class="bg-slate-50 p-2 rounded border border-slate-100">
                            <span class="text-slate-400 block text-[10px]">SECTION / ACT</span>
                            <span class="font-semibold text-slate-700 font-mono">${item.section || 'N/A'}</span>
                        </div>
                    </div>

                    <div class="flex items-center justify-between pt-1">
                        <div class="text-xs">
                            <span class="text-slate-400 text-[11px] block">Next Hearing Date:</span>
                            ${nextDateText}
                        </div>
                        <a href="${msgUrl}" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-3 py-2 rounded-lg flex items-center gap-1.5 shadow transition">
                            <i class="fa-brands fa-whatsapp text-sm"></i> Request Update
                        </a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Render Table Rows (Enforcing RBAC)
        function renderTable(data) {
            const tbody = document.getElementById('causeListTableBody');
            const noResults = document.getElementById('noResults');
            const badge = document.getElementById('filtered-count-badge');
            
            tbody.innerHTML = '';
            badge.innerText = `${data.length} Cases`;

            if (data.length === 0) {
                noResults.classList.remove('hidden');
                return;
            } else {
                noResults.classList.add('hidden');
            }

            data.forEach((item, idx) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition border-b border-slate-200 text-xs sm:text-sm";

                // Stage Styling Badges
                let stageBadgeClass = "bg-slate-100 text-slate-700 border-slate-300";
                const stageUpper = (item.stage || '').toUpperCase();
                
                if (stageUpper.includes('EVE')) stageBadgeClass = "bg-blue-50 text-blue-700 border-blue-200 font-semibold";
                else if (stageUpper.includes('BAHAS')) stageBadgeClass = "bg-amber-50 text-amber-700 border-amber-200 font-semibold";
                else if (stageUpper.includes('CHARGE')) stageBadgeClass = "bg-purple-50 text-purple-700 border-purple-200 font-semibold";
                else if (stageUpper.includes('TALBI')) stageBadgeClass = "bg-teal-50 text-teal-700 border-teal-200 font-semibold";
                else if (stageUpper.includes('APEAL') || stageUpper.includes('APPEAL')) stageBadgeClass = "bg-rose-50 text-rose-700 border-rose-200 font-semibold";

                // Role-based Action Buttons
                let actionBtns = '';
                if (currentRole === 'admin' || currentRole === 'staff') {
                    actionBtns = `
                        <div class="flex items-center justify-center gap-1.5">
                            <button onclick="openEditModal(${item.sn})" title="Edit Case Details" class="p-1.5 rounded-md hover:bg-blue-100 text-blue-600 transition">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </button>
                            <button onclick="openQuickMsg(${item.sn})" title="Send WhatsApp Message" class="p-1.5 rounded-md hover:bg-emerald-100 text-emerald-600 transition">
                                <i class="fa-brands fa-whatsapp"></i>
                            </button>
                        </div>
                    `;
                } else {
                    actionBtns = `<span class="text-slate-400 text-xs italic">Read-Only</span>`;
                }

                tr.innerHTML = `
                    <td class="py-2.5 px-3 text-center font-bold text-slate-600">${item.sn}</td>
                    <td class="py-2.5 px-3 text-slate-500 whitespace-nowrap">${item.prevDate || '-'}</td>
                    <td class="py-2.5 px-3 font-semibold text-navy-900 whitespace-nowrap">${item.court || '-'}</td>
                    <td class="py-2.5 px-3 text-slate-600 font-mono text-xs whitespace-nowrap">${item.caseNo || '-'}</td>
                    <td class="py-2.5 px-4 font-medium text-slate-800">${item.party || '-'}</td>
                    <td class="py-2.5 px-3 text-center font-mono text-xs text-slate-600">${item.section || '-'}</td>
                    <td class="py-2.5 px-3 text-center">
                        <span class="inline-block px-2 py-0.5 text-xs rounded border ${stageBadgeClass}">
                            ${item.stage || '-'}
                        </span>
                    </td>
                    <td class="py-2.5 px-3 text-center font-bold text-emerald-700 bg-emerald-50/50 whitespace-nowrap">
                        ${item.nextDate ? `<span class="px-2 py-0.5 rounded bg-emerald-100 border border-emerald-300">${item.nextDate}</span>` : '<span class="text-slate-300 font-normal">Pending</span>'}
                    </td>
                    <td class="py-2.5 px-3 text-center no-print">
                        ${actionBtns}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // AUDIT TRAIL LOGGING ENGINE
        function logAuditAction(action, details) {
            const container = document.getElementById('auditLogContainer');
            if (auditLogs.length === 0) container.innerHTML = '';

            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const roleTag = currentRole === 'admin' ? '[👑 ADMIN]' : '[👨‍💼 STAFF]';
            const logMsg = `${timeStr} ${roleTag} ${action}: ${details}`;
            
            auditLogs.unshift(logMsg);

            const div = document.createElement('div');
            div.className = "text-slate-700 border-b border-slate-200 pb-1 last:border-0";
            div.innerHTML = `<span class="text-amber-700 font-bold mr-1.5">${timeStr}</span> <span class="font-semibold text-indigo-700">${roleTag}</span> ${action} - <span class="text-slate-600">${details}</span>`;
            container.prepend(div);
        }

        // PERMISSIONS MODAL CONTROLLER
        function openPermissionsModal() {
            document.getElementById('permissionsModal').classList.remove('hidden');
        }

        function closePermissionsModal() {
            document.getElementById('permissionsModal').classList.add('hidden');
        }

        // Update Summary Dashboard Counters
        function updateStatistics() {
            document.getElementById('stat-total').innerText = casesList.length;
            
            let eveCount = 0, bahasCount = 0, chargeCount = 0, talbiCount = 0, noDateCount = 0;

            casesList.forEach(c => {
                const st = (c.stage || '').toUpperCase();
                if (st.includes('EVE')) eveCount++;
                if (st.includes('BAHAS')) bahasCount++;
                if (st.includes('CHARGE')) chargeCount++;
                if (st.includes('TALBI')) talbiCount++;
                if (!c.nextDate || c.nextDate === '' || c.nextDate === '-') noDateCount++;
            });

            document.getElementById('stat-eve').innerText = eveCount;
            document.getElementById('stat-bahas').innerText = bahasCount;
            document.getElementById('stat-charge').innerText = chargeCount;
            document.getElementById('stat-talbi').innerText = talbiCount;
            document.getElementById('stat-nodate').innerText = noDateCount;
        }

        // Populate Court Options Dropdown dynamically
        function populateCourtFilter() {
            const courts = [...new Set(casesList.map(c => c.court).filter(Boolean))].sort();
            const select = document.getElementById('courtFilter');
            select.innerHTML = '<option value="">All Courts (सभी न्यायालय)</option>';
            courts.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.innerText = c;
                select.appendChild(opt);
            });
        }

        // Search & Filter Handler
        function filterCases() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const court = document.getElementById('courtFilter').value;
            const stage = document.getElementById('stageFilter').value;

            filteredCases = casesList.filter(item => {
                const matchesSearch = !query || 
                    (item.party && item.party.toLowerCase().includes(query)) ||
                    (item.caseNo && item.caseNo.toLowerCase().includes(query)) ||
                    (item.section && item.section.toLowerCase().includes(query)) ||
                    (item.sn && item.sn.toString().includes(query));

                const matchesCourt = !court || item.court === court;
                const matchesStage = !stage || (item.stage && item.stage.toUpperCase().includes(stage.toUpperCase()));

                return matchesSearch && matchesCourt && matchesStage;
            });

            renderTable(filteredCases);
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('courtFilter').value = '';
            document.getElementById('stageFilter').value = '';
            document.getElementById('activeShortlistLabel').innerText = "Displaying: All Cases";
            filteredCases = [...casesList];
            renderTable(filteredCases);
        }

        // DYNAMIC PRESET FILTER SHORTLISTS
        function applyPresetFilter(type) {
            resetFilters();
            const label = document.getElementById('activeShortlistLabel');

            if (type === 'all') {
                label.innerText = "Displaying: All Cases";
                filteredCases = [...casesList];
            } else if (type === 'critical') {
                label.innerText = "Shortlist: Critical Stages (DECISION / BAHAS / CHARGE)";
                filteredCases = casesList.filter(c => {
                    const st = (c.stage || '').toUpperCase();
                    return st.includes('DECISION') || st.includes('BAHAS') || st.includes('CHARGE');
                });
            } else if (type === 'highcourt') {
                label.innerText = "Shortlist: High Priority Courts (POCSO / NDPS / DJ)";
                filteredCases = casesList.filter(c => {
                    const ct = (c.court || '').toUpperCase();
                    return ct.includes('POCSO') || ct.includes('NDPS') || ct === 'DJ';
                });
            } else if (type === 'nodate') {
                label.innerText = "Shortlist: Pending Next Hearing Date";
                filteredCases = casesList.filter(c => !c.nextDate || c.nextDate === '' || c.nextDate === '-');
            } else if (type === 'hasdate') {
                label.innerText = "Shortlist: Next Date Assigned";
                filteredCases = casesList.filter(c => c.nextDate && c.nextDate !== '' && c.nextDate !== '-');
            } else if (type === 'ni') {
                label.innerText = "Shortlist: NI Act 138 Cases";
                filteredCases = casesList.filter(c => (c.court || '').toUpperCase().startsWith('NI') || (c.section || '').includes('138'));
            } else if (type === 'eve') {
                label.innerText = "Shortlist: Evidence Stage (EVE)";
                filteredCases = casesList.filter(c => (c.stage || '').toUpperCase().includes('EVE'));
            } else if (type === 'bahas') {
                label.innerText = "Shortlist: Arguments Stage (BAHAS)";
                filteredCases = casesList.filter(c => (c.stage || '').toUpperCase().includes('BAHAS'));
            } else if (type === 'charge') {
                label.innerText = "Shortlist: Charge Framing";
                filteredCases = casesList.filter(c => (c.stage || '').toUpperCase().includes('CHARGE'));
            } else if (type === 'talbi') {
                label.innerText = "Shortlist: Summons / Talbi";
                filteredCases = casesList.filter(c => (c.stage || '').toUpperCase().includes('TALBI'));
            }

            renderTable(filteredCases);
        }

        // TOGGLE ANALYTICS TAB
        function toggleAnalyticsView(tab) {
            const chartsDiv = document.getElementById('analyticsChartsView');
            const pivotDiv = document.getElementById('analyticsPivotView');
            const btnCharts = document.getElementById('btnTabCharts');
            const btnPivot = document.getElementById('btnTabPivot');

            if (tab === 'charts') {
                chartsDiv.classList.remove('hidden');
                pivotDiv.classList.add('hidden');
                btnCharts.className = "px-3 py-1.5 text-xs font-semibold rounded-lg bg-navy-900 text-white transition";
                btnPivot.className = "px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 text-slate-700 hover:bg-slate-200 transition";
            } else {
                chartsDiv.classList.add('hidden');
                pivotDiv.classList.remove('hidden');
                btnPivot.className = "px-3 py-1.5 text-xs font-semibold rounded-lg bg-navy-900 text-white transition";
                btnCharts.className = "px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 text-slate-700 hover:bg-slate-200 transition";
            }
        }

        // GRAPHICAL STATUS CHARTS SETUP (CHART.JS)
        function initCharts() {
            const ctxStage = document.getElementById('stageChart').getContext('2d');
            const ctxCourt = document.getElementById('courtChart').getContext('2d');
            const ctxUrgency = document.getElementById('urgencyChart').getContext('2d');

            stageChartObj = new Chart(ctxStage, {
                type: 'doughnut',
                data: getStageChartData(),
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } } }
            });

            courtChartObj = new Chart(ctxCourt, {
                type: 'bar',
                data: getCourtChartData(),
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
            });

            urgencyChartObj = new Chart(ctxUrgency, {
                type: 'pie',
                data: getUrgencyChartData(),
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } } }
            });
        }

        function updateCharts() {
            if (!stageChartObj || !courtChartObj || !urgencyChartObj) return;
            stageChartObj.data = getStageChartData();
            stageChartObj.update();

            courtChartObj.data = getCourtChartData();
            courtChartObj.update();

            urgencyChartObj.data = getUrgencyChartData();
            urgencyChartObj.update();
        }

        function getStageChartData() {
            const counts = {};
            casesList.forEach(c => {
                const st = c.stage || 'OTHER';
                counts[st] = (counts[st] || 0) + 1;
            });
            return {
                labels: Object.keys(counts),
                datasets: [{
                    data: Object.values(counts),
                    backgroundColor: ['#2563eb', '#d97706', '#9333ea', '#0d9488', '#e11d48', '#64748b', '#059669', '#d946ef']
                }]
            };
        }

        function getCourtChartData() {
            const counts = {};
            casesList.forEach(c => {
                const ct = c.court || 'UNKNOWN';
                counts[ct] = (counts[ct] || 0) + 1;
            });
            const sorted = Object.entries(counts).sort((a,b) => b[1] - a[1]).slice(0, 8);
            return {
                labels: sorted.map(x => x[0]),
                datasets: [{
                    label: 'Cases Count',
                    data: sorted.map(x => x[1]),
                    backgroundColor: '#102a43'
                }]
            };
        }

        function getUrgencyChartData() {
            let nextDateSet = 0, pendingNextDate = 0;
            casesList.forEach(c => {
                if (c.nextDate && c.nextDate !== '' && c.nextDate !== '-') nextDateSet++;
                else pendingNextDate++;
            });
            return {
                labels: ['Next Date Fixed', 'Next Date Pending'],
                datasets: [{
                    data: [nextDateSet, pendingNextDate],
                    backgroundColor: ['#10b981', '#f59e0b']
                }]
            };
        }

        // DYNAMIC PIVOT TABLE MATRIX ENGINE
        function renderPivotMatrix() {
            const rowAttr = document.getElementById('pivotRowAxis').value;
            const colAttr = document.getElementById('pivotColAxis').value;
            const metric = document.getElementById('pivotMetric').value;

            function getValue(item, attr) {
                if (attr === 'hasNextDate') {
                    return (item.nextDate && item.nextDate !== '' && item.nextDate !== '-') ? 'Date Set' : 'Pending Date';
                }
                return item[attr] || 'N/A';
            }

            const rowValues = [...new Set(casesList.map(c => getValue(c, rowAttr)))].sort();
            const colValues = [...new Set(casesList.map(c => getValue(c, colAttr)))].sort();

            const thead = document.getElementById('pivotTableHeader');
            const tbody = document.getElementById('pivotTableBody');

            // Header
            let headHtml = `<tr><th class="py-2 px-3 border border-navy-800 bg-navy-950 font-semibold">${rowAttr.toUpperCase()} \\ ${colAttr.toUpperCase()}</th>`;
            colValues.forEach(col => {
                headHtml += `<th class="py-2 px-2 text-center border border-navy-800 whitespace-nowrap">${col}</th>`;
            });
            headHtml += `<th class="py-2 px-3 text-center border border-navy-800 bg-navy-950 font-bold">Total</th></tr>`;
            thead.innerHTML = headHtml;

            // Body
            let bodyHtml = '';
            rowValues.forEach(rVal => {
                bodyHtml += `<tr><td class="py-1.5 px-3 font-semibold text-slate-800 bg-slate-50 border border-slate-200">${rVal}</td>`;
                let rowSum = 0;

                colValues.forEach(cVal => {
                    const matches = casesList.filter(c => getValue(c, rowAttr) === rVal && getValue(c, colAttr) === cVal);
                    const count = matches.length;
                    rowSum += count;

                    let displayVal = count;
                    if (metric === 'percentage') {
                        displayVal = casesList.length ? `${((count / casesList.length) * 100).toFixed(1)}%` : '0%';
                    }

                    const bgClass = count > 0 ? 'hover:bg-amber-100 cursor-pointer text-navy-900 font-bold' : 'text-slate-300';
                    bodyHtml += `<td onclick="drilldownPivot('${rowAttr}', '${rVal.replace(/'/g, "\\'")}', '${colAttr}', '${cVal.replace(/'/g, "\\'")}')" class="py-1.5 px-2 text-center border border-slate-200 ${bgClass}">${displayVal}</td>`;
                });

                let totalDisplay = rowSum;
                if (metric === 'percentage') {
                    totalDisplay = `${((rowSum / casesList.length) * 100).toFixed(1)}%`;
                }

                bodyHtml += `<td class="py-1.5 px-3 text-center font-bold bg-slate-100 border border-slate-200">${totalDisplay}</td></tr>`;
            });

            tbody.innerHTML = bodyHtml;
        }

        // PIVOT DRILLDOWN SHORTLISTING
        function drilldownPivot(rowAttr, rowVal, colAttr, colVal) {
            function getValue(item, attr) {
                if (attr === 'hasNextDate') {
                    return (item.nextDate && item.nextDate !== '' && item.nextDate !== '-') ? 'Date Set' : 'Pending Date';
                }
                return item[attr] || 'N/A';
            }

            resetFilters();
            filteredCases = casesList.filter(c => getValue(c, rowAttr) === rowVal && getValue(c, colAttr) === colVal);
            document.getElementById('activeShortlistLabel').innerText = `Matrix Shortlist: ${rowAttr.toUpperCase()} = "${rowVal}" & ${colAttr.toUpperCase()} = "${colVal}"`;
            renderTable(filteredCases);
        }

        // MODAL MANAGEMENT - EDIT / ADD
        function openEditModal(sn) {
            const item = casesList.find(c => c.sn === sn);
            if (!item) return;

            document.getElementById('modalTitle').innerText = `Edit Case S.N. ${item.sn}`;
            document.getElementById('editIndex').value = item.sn;
            document.getElementById('editSn').value = item.sn;
            document.getElementById('editPrevDate').value = item.prevDate || '';
            document.getElementById('editCourt').value = item.court || '';
            document.getElementById('editCaseNo').value = item.caseNo || '';
            document.getElementById('editParty').value = item.party || '';
            document.getElementById('editSection').value = item.section || '';
            document.getElementById('editStage').value = item.stage || 'EVE';
            document.getElementById('editNextDate').value = item.nextDate || '';

            // Restrict field editing for Staff role if needed
            const btnDelete = document.getElementById('btnDeleteCase');
            if (currentRole === 'admin') {
                btnDelete.style.display = 'block';
            } else {
                btnDelete.style.display = 'none';
            }

            document.getElementById('editModal').classList.remove('hidden');
        }

        function openNewCaseModal() {
            if (currentRole !== 'admin') {
                alert('Only Admin can add new cases to system.');
                return;
            }

            document.getElementById('modalTitle').innerText = 'Add New Case Entry';
            document.getElementById('editIndex').value = '-1';
            document.getElementById('editSn').value = casesList.length ? Math.max(...casesList.map(c => c.sn)) + 1 : 1;
            document.getElementById('editPrevDate').value = "26/10/2026";
            document.getElementById('editCourt').value = '';
            document.getElementById('editCaseNo').value = '';
            document.getElementById('editParty').value = '';
            document.getElementById('editSection').value = '';
            document.getElementById('editStage').value = 'EVE';
            document.getElementById('editNextDate').value = '';

            document.getElementById('btnDeleteCase').style.display = 'none';
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        function autoCalculateNextDate() {
            const today = new Date();
            today.setDate(today.getDate() + 14); // Default 2 weeks interval
            const dd = String(today.getDate()).padStart(2, '0');
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const yyyy = today.getFullYear();
            document.getElementById('editNextDate').value = `${dd}/${mm}/${yyyy}`;
        }

        function saveCase(e) {
            e.preventDefault();
            const editSnVal = parseInt(document.getElementById('editIndex').value);
            const sn = parseInt(document.getElementById('editSn').value);

            const updatedObj = {
                sn: sn,
                prevDate: document.getElementById('editPrevDate').value,
                court: document.getElementById('editCourt').value.toUpperCase(),
                caseNo: document.getElementById('editCaseNo').value,
                party: document.getElementById('editParty').value.toUpperCase(),
                section: document.getElementById('editSection').value,
                stage: document.getElementById('editStage').value,
                nextDate: document.getElementById('editNextDate').value
            };

            if (editSnVal === -1) {
                // New Case
                casesList.push(updatedObj);
                logAuditAction('Added New Case', `S.N. ${sn} - ${updatedObj.party.substring(0, 30)}`);
            } else {
                // Update Existing
                const index = casesList.findIndex(c => c.sn === editSnVal);
                if (index !== -1) {
                    casesList[index] = updatedObj;
                    logAuditAction('Updated Case Details', `S.N. ${sn} Next Date: ${updatedObj.nextDate || 'None'}`);
                }
            }

            persistData();
            populateCourtFilter();
            filterCases();
            closeEditModal();
        }

        function deleteCaseFromModal() {
            if (currentRole !== 'admin') {
                alert('Only Admin can delete case records.');
                return;
            }

            const sn = parseInt(document.getElementById('editIndex').value);
            if (confirm(`Are you sure you want to delete Case S.N. ${sn}?`)) {
                casesList = casesList.filter(c => c.sn !== sn);
                logAuditAction('Deleted Case Record', `S.N. ${sn}`);
                persistData();
                populateCourtFilter();
                filterCases();
                closeEditModal();
            }
        }

        // MESSAGING & NOTIFICATION SYSTEM
        function openMsgModal() {
            document.getElementById('msgModal').classList.remove('hidden');
        }

        function closeMsgModal() {
            document.getElementById('msgModal').classList.add('hidden');
        }

        function openQuickMsg(sn) {
            openMsgModal();
            const select = document.getElementById('msgCaseSelect');
            select.value = sn;
            autoFillMsgTemplate();
        }

        function populateMsgSelect() {
            const select = document.getElementById('msgCaseSelect');
            select.innerHTML = '<option value="">-- Choose a Case from Today\'s List --</option>';
            casesList.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.sn;
                opt.innerText = `[S.N. ${c.sn}] ${c.court} - ${c.party.substring(0, 45)}...`;
                select.appendChild(opt);
            });
        }

        function autoFillMsgTemplate() {
            const sn = parseInt(document.getElementById('msgCaseSelect').value);
            if (!sn) return;

            const caseObj = casesList.find(c => c.sn === sn);
            if (!caseObj) return;

            applyMsgTemplate(caseObj);
        }

        function applyMsgTemplate(givenCaseObj = null) {
            const sn = parseInt(document.getElementById('msgCaseSelect').value);
            const caseObj = givenCaseObj || casesList.find(c => c.sn === sn) || {
                party: "[प्रकरण का नाम]",
                court: "[न्यायालय]",
                caseNo: "[केस नंबर]",
                nextDate: "[आगामी तारीख]"
            };

            const tplType = document.getElementById('msgTemplateSelect').value;
            const bodyArea = document.getElementById('msgBody');

            const nextDt = caseObj.nextDate || "[तारीख निर्धारित की जानी है]";

            if (tplType === 'next_date') {
                bodyArea.value = `नमस्ते,\nआपके न्यायालय प्रकरण (${caseObj.party}) कोर्ट ${caseObj.court} (केस नं. ${caseObj.caseNo}) में आज की सुनवाई के पश्चात् आगामी तारीख पेशी: ${nextDt} नियत की गई है।\n\nकार्यालय: अनीस नागोरी, अधिवक्ता\nमो. 9887642984`;
            } else if (tplType === 'evidence_req') {
                bodyArea.value = `महत्वपूर्ण सूचना:\nआपके प्रकरण (${caseObj.party}) में कोर्ट ${caseObj.court} द्वारा गवाही/साक्ष्य (EVE) हेतु तारीख: ${nextDt} तय की गई है। कृपया समय पर कोर्ट में उपस्थित रहें।\n\n- अनीस नागोरी, अधिवक्ता (मो. 9887642984)`;
            } else if (tplType === 'urgent_call') {
                bodyArea.value = `आवश्यक सूचना:\nआपके केस (${caseObj.party}) के सम्बन्ध में आवश्यक विचार-विमर्श हेतु अधिवक्ता कार्यालय में संपर्क करें।\n\nअनीस नागोरी, एडवोकेट\nमो. 9887642984`;
            } else {
                bodyArea.value = `श्रीमान,\nमामला: ${caseObj.party}\nकोर्ट: ${caseObj.court}\n\n[यहाँ अपना सन्देश लिखें]`;
            }
        }

        function sendWhatsApp() {
            const mobile = document.getElementById('msgMobile').value.trim();
            const body = encodeURIComponent(document.getElementById('msgBody').value);

            if (!body) {
                alert('Message content cannot be empty.');
                return;
            }

            logMessageSent('WhatsApp', mobile);
            logAuditAction('Sent WhatsApp Update', `To: ${mobile || 'Client'}`);
            const url = mobile ? `https://wa.me/91${mobile}?text=${body}` : `https://wa.me/?text=${body}`;
            window.open(url, '_blank');
        }

        function sendSMS() {
            const mobile = document.getElementById('msgMobile').value.trim();
            const body = encodeURIComponent(document.getElementById('msgBody').value);

            if (!mobile) {
                alert('Please enter a mobile number to send SMS.');
                return;
            }

            logMessageSent('SMS', mobile);
            logAuditAction('Sent SMS Update', `To: ${mobile}`);
            window.open(`sms:${mobile}?body=${body}`, '_blank');
        }

        function copyMsgToClipboard() {
            const text = document.getElementById('msgBody').value;
            const temp = document.createElement('textarea');
            temp.value = text;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand('copy');
            document.body.removeChild(temp);
            alert('Message copied to clipboard!');
        }

        function logMessageSent(type, recipient) {
            const container = document.getElementById('msgLogContainer');
            if (sentMessageLogs.length === 0) container.innerHTML = '';

            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const logEntry = `[${timeStr}] Sent via ${type} to ${recipient || 'Client'}`;
            sentMessageLogs.unshift(logEntry);

            const div = document.createElement('div');
            div.className = "flex items-center justify-between text-xs py-1 border-b border-slate-200 last:border-0";
            div.innerHTML = `<span><i class="fa-regular fa-paper-plane text-emerald-600 mr-1.5"></i> ${logEntry}</span> <span class="text-emerald-700 font-semibold">Sent</span>`;
            container.prepend(div);
        }

        // BACKUP & RESTORE JSON DATA
        function exportJSONBackup() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(casesList, null, 2));
            const link = document.createElement('a');
            link.setAttribute("href", dataStr);
            link.setAttribute("download", `Anis_Nagori_Cases_Backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            logAuditAction('Exported Data Backup', 'JSON Format');
        }

        function importJSONBackup(event) {
            if (currentRole !== 'admin') {
                alert('Only Admin can import database backups.');
                return;
            }

            const fileReader = new FileReader();
            fileReader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (Array.isArray(importedData)) {
                        casesList = importedData;
                        persistData();
                        populateCourtFilter();
                        resetFilters();
                        logAuditAction('Restored Data Backup', `Imported ${importedData.length} records`);
                        alert('Data successfully restored from JSON file!');
                    } else {
                        alert('Invalid JSON format.');
                    }
                } catch(err) {
                    alert('Error reading JSON file.');
                }
            };
            fileReader.readAsText(event.target.files[0]);
        }

        // EXPORT TO EXCEL / CSV
        function exportCSV() {
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "S.N.,Previous Date,Name of Court,Case No,Party VS Case,Section,Stage,Next Date\n";

            filteredCases.forEach(row => {
                const partyEscaped = `"${row.party.replace(/"/g, '""')}"`;
                csvContent += `${row.sn},"${row.prevDate}","${row.court}","${row.caseNo}",${partyEscaped},"${row.section}","${row.stage}","${row.nextDate}"\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Cause_List_Anis_Nagori_26_OCT_2026.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // EXPORT TO PDF USING JSPDF
        function exportPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

            // Header Title
            doc.setFontSize(16);
            doc.setFont('helvetica', 'bold');
            doc.text("ANIS NAGORI ADVOCATE", 105, 14, { align: "center" });

            doc.setFontSize(10);
            doc.setFont('helvetica', 'normal');
            doc.text("Mobile: 9887642984, 9887642980", 105, 19, { align: "center" });
            doc.text("DAILY CAUSE LIST - 26-OCT-2026 (MONDAY)", 105, 24, { align: "center" });

            // Prepare Table Data
            const tableHeaders = [["S.N.", "Prev Date", "Court", "Case No", "Party VS Case", "Sec", "Stage", "Next Date"]];
            const tableRows = filteredCases.map(c => [
                c.sn,
                c.prevDate || '-',
                c.court || '-',
                c.caseNo || '-',
                c.party || '-',
                c.section || '-',
                c.stage || '-',
                c.nextDate || '-'
            ]);

            doc.autoTable({
                head: tableHeaders,
                body: tableRows,
                startY: 28,
                theme: 'grid',
                styles: { fontSize: 7, cellPadding: 1.5 },
                headStyles: { fillColor: [11, 27, 43], textColor: [255, 255, 255], fontStyle: 'bold' },
                columnStyles: {
                    0: { cellWidth: 10, halign: 'center' },
                    1: { cellWidth: 18 },
                    2: { cellWidth: 16 },
                    3: { cellWidth: 18 },
                    4: { cellWidth: 70 },
                    5: { cellWidth: 14, halign: 'center' },
                    6: { cellWidth: 20, halign: 'center' },
                    7: { cellWidth: 20, halign: 'center' }
                }
            });

            doc.save("Advocate_Anis_Nagori_Cause_List.pdf");
        }
    </script>
</body>
</html>
