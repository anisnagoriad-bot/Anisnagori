<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advocate Cause List & Case Management System - RBAC Enabled</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js for Graphical Working Status -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- JSPDF & AutoTable for PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            50: '#f0f4f8',
                            100: '#d9e2ec',
                            700: '#102a43',
                            800: '#0b1b2b',
                            900: '#06101e',
                        },
                        gold: {
                            500: '#d4af37',
                            600: '#b89628',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; color: black; }
            .shadow-card { box-shadow: none !important; border: 1px solid #ddd; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Top Header Banner -->
    <header class="bg-navy-900 text-white shadow-lg sticky top-0 z-30 no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-gold-500 text-navy-900 flex items-center justify-center text-xl font-bold shadow-md">
                    <i class="fa-solid fa-scale-balanced"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                        <span>Anis Nagori</span>
                        <span id="roleBadge" class="text-xs bg-gold-500/20 text-gold-500 border border-gold-500/40 px-2 py-0.5 rounded font-normal">
                            👑 Admin Role
                        </span>
                    </h1>
                    <p class="text-xs text-slate-300 flex items-center gap-3">
                        <span><i class="fa-solid fa-phone text-gold-500 mr-1"></i> 9887642984, 9887642980</span>
                        <span><i class="fa-regular fa-calendar-check text-gold-500 mr-1"></i> Cause List Date: <strong class="text-white">26-OCT-2026 (MONDAY)</strong></span>
                    </p>
                </div>
            </div>

            <!-- Role Selector & Quick Actions -->
            <div class="flex flex-wrap items-center gap-2">
                
                <!-- Role Switcher Dropdown -->
                <div class="flex items-center bg-navy-800 border border-slate-700 rounded-lg p-1 text-xs">
                    <span class="text-slate-400 px-1.5 font-medium"><i class="fa-solid fa-user-shield text-gold-500"></i> Role:</span>
                    <select id="roleSelector" onchange="switchRole(this.value)" class="bg-navy-900 text-gold-500 font-semibold px-2 py-1 rounded border border-slate-600 focus:outline-none cursor-pointer">
                        <option value="admin">👑 Admin (Anis Nagori)</option>
                        <option value="staff">👨‍💼 Staff / Junior Advocate</option>
                        <option value="client">👤 Client (Litigant View)</option>
                    </select>
                </div>

                <!-- Admin & Staff Tools -->
                <button id="btnAddCaseBtn" onclick="openNewCaseModal()" class="admin-only bg-emerald-600 hover:bg-emerald-500 text-white text-xs sm:text-sm px-3 py-2 rounded-lg font-medium flex items-center gap-1.5 transition shadow">
                    <i class="fa-solid fa-plus"></i>
                    <span>Add Case</span>
                </button>
                <button id="btnMsgBtn" onclick="openMsgModal()" class="admin-staff bg-indigo-600 hover:bg-indigo-500 text-white text-xs sm:text-sm px-3 py-2 rounded-lg font-medium flex items-center gap-1.5 transition shadow">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span>Send Update</span>
                </button>
                <button id="btnPermissionsBtn" onclick="openPermissionsModal()" class="admin-only bg-amber-600 hover:bg-amber-500 text-white text-xs sm:text-sm px-2.5 py-2 rounded-lg font-medium transition shadow" title="Role Permissions & Audit Trail">
                    <i class="fa-solid fa-shield-halved"></i>
                </button>
                
                <button onclick="exportJSONBackup()" title="Backup JSON Data" class="admin-only bg-slate-700 hover:bg-slate-600 text-white text-xs sm:text-sm px-2.5 py-2 rounded-lg transition shadow">
                    <i class="fa-solid fa-download text-amber-400"></i>
                </button>
                <label class="admin-only bg-slate-700 hover:bg-slate-600 text-white text-xs sm:text-sm px-2.5 py-2 rounded-lg cursor-pointer transition shadow" title="Restore Data JSON">
                    <i class="fa-solid fa-upload text-sky-400"></i>
                    <input type="file" id="jsonInput" class="hidden" accept=".json" onchange="importJSONBackup(event)">
                </label>
                <button onclick="exportPDF()" class="admin-staff bg-slate-700 hover:bg-slate-600 text-white text-xs sm:text-sm px-3 py-2 rounded-lg font-medium flex items-center gap-1.5 transition shadow">
                    <i class="fa-solid fa-file-pdf text-red-400"></i>
                    <span class="hidden sm:inline">Export PDF</span>
                </button>
                <button onclick="exportCSV()" class="admin-staff bg-slate-700 hover:bg-slate-600 text-white text-xs sm:text-sm px-3 py-2 rounded-lg font-medium flex items-center gap-1.5 transition shadow">
                    <i class="fa-solid fa-file-csv text-emerald-400"></i>
                    <span class="hidden sm:inline">CSV</span>
                </button>
                <button onclick="window.print()" class="admin-staff bg-slate-700 hover:bg-slate-600 text-white text-xs sm:text-sm px-3 py-2 rounded-lg font-medium flex items-center gap-1.5 transition shadow">
                    <i class="fa-solid fa-print"></i>
                    <span class="hidden sm:inline">Print</span>
                </button>
            </div>
        </div>
    </header>

    <!-- CLIENT PORTAL VIEW (Visible Only in Client Role) -->
    <section id="clientPortalView" class="hidden max-w-5xl mx-auto px-4 py-8 w-full space-y-6">
        <div class="bg-gradient-to-br from-navy-900 to-slate-800 text-white rounded-2xl p-6 shadow-xl border border-gold-500/30 text-center space-y-4">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gold-500/20 text-gold-500 text-3xl mb-2 border border-gold-500/40">
                <i class="fa-solid fa-landmark"></i>
            </div>
            <h2 class="text-2xl font-bold tracking-tight">Client Legal Hearing Status Portal</h2>
            <p class="text-slate-300 text-sm max-w-xl mx-auto">Welcome to Advocate Anis Nagori's Client Portal. Enter your Case Number or Litigant Name below to inspect your current court stage and upcoming hearing date.</p>
            
            <div class="max-w-xl mx-auto relative pt-2">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-5 text-slate-400 text-base"></i>
                <input type="text" id="clientSearchInput" onkeyup="searchClientCases()" placeholder="Search by Case No. (e.g. 166/26) or Party Name..." 
                       class="w-full pl-11 pr-4 py-3 bg-white text-slate-900 rounded-xl font-medium focus:outline-none focus:ring-4 focus:ring-gold-500/50 shadow-inner">
            </div>
        </div>

        <!-- Client Search Results -->
        <div id="clientResultsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Dynamic Client Cards Output -->
        </div>

        <div id="clientNoResults" class="bg-white rounded-xl p-8 text-center text-slate-500 border border-slate-200 shadow-sm">
            <i class="fa-solid fa-folder-open text-4xl text-slate-300 mb-2"></i>
            <p class="font-semibold text-base text-slate-700">No client cases matched your query</p>
            <p class="text-xs text-slate-400 mt-1">Please enter your exact case number or name registered in court.</p>
        </div>
    </section>

    <!-- MAIN ADMIN / STAFF MANAGEMENT DASHBOARD -->
    <main id="adminStaffDashboard" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <!-- Analytics Overview Cards -->
        <section class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3 no-print">
            <div class="bg-white rounded-xl p-3 border border-slate-200 shadow-sm flex flex-col justify-between hover:border-slate-300 transition cursor-pointer" onclick="applyPresetFilter('all')">
                <span class="text-xs text-slate-500 font-medium">Total Listed Cases</span>
                <div class="flex items-baseline justify-between mt-1">
                    <span id="stat-total" class="text-2xl font-bold text-navy-900">75</span>
                    <i class="fa-solid fa-folder-open text-slate-400 text-lg"></i>
                </div>
            </div>
            <div class="bg-white rounded-xl p-3 border border-slate-200 shadow-sm flex flex-col justify-between hover:border-blue-300 transition cursor-pointer" onclick="applyPresetFilter('eve')">
                <span class="text-xs text-slate-500 font-medium">Evidence (EVE)</span>
                <div class="flex items-baseline justify-between mt-1">
                    <span id="stat-eve" class="text-2xl font-bold text-blue-600">0</span>
                    <i class="fa-solid fa-user-shield text-blue-300 text-lg"></i>
                </div>
            </div>
            <div class="bg-white rounded-xl p-3 border border-slate-200 shadow-sm flex flex-col justify-between hover:border-amber-300 transition cursor-pointer" onclick="applyPresetFilter('bahas')">
                <span class="text-xs text-slate-500 font-medium">Arguments (BAHAS)</span>
                <div class="flex items-baseline justify-between mt-1">
                    <span id="stat-bahas" class="text-2xl font-bold text-amber-600">0</span>
                    <i class="fa-solid fa-comments text-amber-300 text-lg"></i>
                </div>
            </div>
            <div class="bg-white rounded-xl p-3 border border-slate-200 shadow-sm flex flex-col justify-between hover:border-purple-300 transition cursor-pointer" onclick="applyPresetFilter('charge')">
                <span class="text-xs text-slate-500 font-medium">Charge Framing</span>
                <div class="flex items-baseline justify-between mt-1">
                    <span id="stat-charge" class="text-2xl font-bold text-purple-600">0</span>
                    <i class="fa-solid fa-gavel text-purple-300 text-lg"></i>
                </div>
            </div>
            <div class="bg-white rounded-xl p-3 border border-slate-200 shadow-sm flex flex-col justify-between hover:border-teal-300 transition cursor-pointer" onclick="applyPresetFilter('talbi')">
                <span class="text-xs text-slate-500 font-medium">Summons / Talbi</span>
                <div class="flex items-baseline justify-between mt-1">
                    <span id="stat-talbi" class="text-2xl font-bold text-teal-600">0</span>
                    <i class="fa-solid fa-envelope-open-text text-teal-300 text-lg"></i>
                </div>
            </div>
            <div class="bg-white rounded-xl p-3 border border-slate-200 shadow-sm flex flex-col justify-between hover:border-rose-300 transition cursor-pointer" onclick="applyPresetFilter('nodate')">
                <span class="text-xs text-slate-500 font-medium">Pending Next Date</span>
                <div class="flex items-baseline justify-between mt-1">
                    <span id="stat-nodate" class="text-2xl font-bold text-rose-600">0</span>
                    <i class="fa-solid fa-calendar-xmark text-rose-300 text-lg"></i>
                </div>
            </div>
        </section>

        <!-- DASHBOARD GRAPHICAL & PIVOT SECTION TOGGLE -->
        <section class="bg-white rounded-xl border border-slate-200 shadow-sm p-4 no-print space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 pb-3">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-chart-pie text-navy-700 text-lg"></i>
                    <h2 class="font-bold text-slate-800 text-base">Working Status Analytics & Dynamic Matrix</h2>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="toggleAnalyticsView('charts')" id="btnTabCharts" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-navy-900 text-white transition">
                        <i class="fa-solid fa-chart-column mr-1"></i> Status Charts
                    </button>
                    <button onclick="toggleAnalyticsView('pivot')" id="btnTabPivot" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 text-slate-700 hover:bg-slate-200 transition">
                        <i class="fa-solid fa-table-cells mr-1"></i> Pivot Matrix
                    </button>
                </div>
            </div>

            <!-- Charts Graphical Tab -->
            <div id="analyticsChartsView" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div class="bg-slate-50 rounded-xl p-3 border border-slate-200 flex flex-col items-center">
                    <h3 class="text-xs font-bold text-slate-700 mb-2 uppercase tracking-wider">Working Stage Distribution</h3>
                    <div class="w-full h-48 relative">
                        <canvas id="stageChart"></canvas>
                    </div>
                </div>
                <div class="bg-slate-50 rounded-xl p-3 border border-slate-200 flex flex-col items-center">
                    <h3 class="text-xs font-bold text-slate-700 mb-2 uppercase tracking-wider">Court-wise Case Distribution</h3>
                    <div class="w-full h-48 relative">
                        <canvas id="courtChart"></canvas>
                    </div>
                </div>
                <div class="bg-slate-50 rounded-xl p-3 border border-slate-200 flex flex-col items-center md:col-span-2 lg:col-span-1">
                    <h3 class="text-xs font-bold text-slate-700 mb-2 uppercase tracking-wider">Actionable Urgency Status</h3>
                    <div class="w-full h-48 relative">
                        <canvas id="urgencyChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Dynamic Pivot Table Matrix Tab -->
            <div id="analyticsPivotView" class="hidden space-y-3">
                <div class="flex flex-wrap items-center justify-between gap-3 bg-slate-50 p-2.5 rounded-lg border border-slate-200 text-xs">
                    <div class="flex flex-wrap items-center gap-3">
                        <div class="flex items-center gap-1.5">
                            <span class="font-semibold text-slate-600">Rows:</span>
                            <select id="pivotRowAxis" onchange="renderPivotMatrix()" class="bg-white border border-slate-300 rounded px-2 py-1 focus:ring-2 focus:ring-navy-700">
                                <option value="court">Court Name</option>
                                <option value="stage" selected>Stage / Position</option>
                                <option value="section">IPC / Act Section</option>
                            </select>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <span class="font-semibold text-slate-600">Columns:</span>
                            <select id="pivotColAxis" onchange="renderPivotMatrix()" class="bg-white border border-slate-300 rounded px-2 py-1 focus:ring-2 focus:ring-navy-700">
                                <option value="court" selected>Court Name</option>
                                <option value="stage">Stage / Position</option>
                                <option value="hasNextDate">Next Date Status</option>
                            </select>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <span class="font-semibold text-slate-600">Metric:</span>
                            <select id="pivotMetric" onchange="renderPivotMatrix()" class="bg-white border border-slate-300 rounded px-2 py-1 focus:ring-2 focus:ring-navy-700">
                                <option value="count">Count of Cases</option>
                                <option value="percentage">% Percentage</option>
                            </select>
                        </div>
                    </div>
                    <span class="text-slate-400 italic text-[11px]"><i class="fa-solid fa-hand-pointer mr-1"></i>Click any matrix cell to shortlist cases!</span>
                </div>

                <div class="overflow-x-auto custom-scrollbar border border-slate-200 rounded-lg max-h-72">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead id="pivotTableHeader" class="bg-navy-900 text-white sticky top-0">
                            <!-- Dynamic Matrix Header -->
                        </thead>
                        <tbody id="pivotTableBody" class="divide-y divide-slate-200 bg-white font-mono">
                            <!-- Dynamic Matrix Rows -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- Quick Presets Shortlisting Bar -->
        <section class="bg-white rounded-xl p-3 border border-slate-200 shadow-sm no-print space-y-2">
            <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-slate-600 uppercase tracking-wider flex items-center gap-1.5">
                    <i class="fa-solid fa-filter text-gold-600"></i> Dynamic Shortlisting Presets
                </span>
                <span id="activeShortlistLabel" class="text-xs bg-navy-50 text-navy-700 font-semibold px-2 py-0.5 rounded border border-navy-100">Displaying: All Cases</span>
            </div>
            <div class="flex flex-wrap gap-2 text-xs">
                <button onclick="applyPresetFilter('all')" class="preset-btn px-2.5 py-1 rounded-lg bg-slate-800 text-white font-medium hover:bg-slate-700 transition">
                    All Cases (75)
                </button>
                <button onclick="applyPresetFilter('critical')" class="preset-btn px-2.5 py-1 rounded-lg bg-rose-50 text-rose-700 border border-rose-200 font-medium hover:bg-rose-100 transition">
                    <i class="fa-solid fa-circle-exclamation mr-1"></i> Critical (Decision/Bahas/Charge)
                </button>
                <button onclick="applyPresetFilter('highcourt')" class="preset-btn px-2.5 py-1 rounded-lg bg-purple-50 text-purple-700 border border-purple-200 font-medium hover:bg-purple-100 transition">
                    <i class="fa-solid fa-building-columns mr-1"></i> High Priority Courts (POCSO/NDPS/DJ)
                </button>
                <button onclick="applyPresetFilter('nodate')" class="preset-btn px-2.5 py-1 rounded-lg bg-amber-50 text-amber-800 border border-amber-200 font-medium hover:bg-amber-100 transition">
                    <i class="fa-solid fa-clock mr-1"></i> Next Date Pending
                </button>
                <button onclick="applyPresetFilter('hasdate')" class="preset-btn px-2.5 py-1 rounded-lg bg-emerald-50 text-emerald-800 border border-emerald-200 font-medium hover:bg-emerald-100 transition">
                    <i class="fa-solid fa-calendar-check mr-1"></i> Next Date Assigned
                </button>
                <button onclick="applyPresetFilter('ni')" class="preset-btn px-2.5 py-1 rounded-lg bg-sky-50 text-sky-700 border border-sky-200 font-medium hover:bg-sky-100 transition">
                    NI 138 Cases
                </button>
            </div>
        </section>

        <!-- Controls: Filters, Search, Display Options -->
        <section class="bg-white rounded-xl p-4 border border-slate-200 shadow-sm space-y-3 no-print">
            <div class="grid grid-cols-1 md:grid-cols-12 gap-3">
                <!-- Search Input -->
                <div class="md:col-span-4 relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400"></i>
                    <input type="text" id="searchInput" placeholder="Search party, accused, section, case no..." 
                           class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-navy-700"
                           onkeyup="filterCases()">
                </div>

                <!-- Court Filter -->
                <div class="md:col-span-3">
                    <select id="courtFilter" onchange="filterCases()" class="w-full py-2 px-3 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-navy-700">
                        <option value="">All Courts (सभी न्यायालय)</option>
                    </select>
                </div>

                <!-- Stage Filter -->
                <div class="md:col-span-3">
                    <select id="stageFilter" onchange="filterCases()" class="w-full py-2 px-3 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-navy-700">
                        <option value="">All Stages (सभी चरण)</option>
                        <option value="EVE">EVE (Evidence)</option>
                        <option value="BAHAS">BAHAS (Arguments)</option>
                        <option value="CHARGE">CHARGE</option>
                        <option value="TALBI">TALBI (Summons)</option>
                        <option value="APEAL">APPEAL</option>
                        <option value="RP">RP (Re-Plea/Report)</option>
                        <option value="DECISION">DECISION</option>
                        <option value="BAYAN MULJIM">BAYAN MULJIM</option>
                    </select>
                </div>

                <!-- Reset Button -->
                <div class="md:col-span-2 flex gap-2">
                    <button onclick="resetFilters()" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-medium py-2 rounded-lg transition flex items-center justify-center gap-1">
                        <i class="fa-solid fa-rotate-left"></i> Reset
                    </button>
                </div>
            </div>
        </section>

        <!-- Cause List Printable Header (Only Visible on Print) -->
        <div class="hidden print-only mb-6 text-center border-b-2 border-slate-800 pb-4">
            <h1 class="text-2xl font-bold">ANIS NAGORI ADVOCATE</h1>
            <p class="text-sm">Mobile: 9887642984, 9887642980</p>
            <p class="text-base font-semibold mt-2">DAILY CAUSE LIST - 26-OCT-2026 (MONDAY)</p>
        </div>

        <!-- Table View Section -->
        <section class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden flex flex-col">
            <div class="px-4 py-3 bg-slate-100/80 border-b border-slate-200 flex items-center justify-between no-print">
                <div class="flex items-center gap-2">
                    <h2 class="font-semibold text-slate-700 text-sm sm:text-base flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-navy-700"></i>
                        <span>Cause List Records</span>
                    </h2>
                    <span id="filtered-count-badge" class="bg-navy-900 text-white text-xs font-semibold px-2.5 py-0.5 rounded-full">75 Cases</span>
                </div>
                <div class="text-xs text-slate-500">
                    Click edit button <i class="fa-solid fa-pen-to-square text-blue-600"></i> on any row to edit case details or next date.
                </div>
            </div>

            <!-- Table Container -->
            <div class="overflow-x-auto custom-scrollbar">
                <table class="w-full text-left border-collapse text-xs sm:text-sm">
                    <thead>
                        <tr class="bg-navy-900 text-white font-medium">
                            <th class="py-3 px-3 w-12 text-center border-b border-navy-800">S.N.</th>
                            <th class="py-3 px-3 w-28 border-b border-navy-800">Prev Date</th>
                            <th class="py-3 px-3 w-24 border-b border-navy-800">Court</th>
                            <th class="py-3 px-3 w-24 border-b border-navy-800">Case No.</th>
                            <th class="py-3 px-4 border-b border-navy-800 min-w-[260px]">Party VS Case (Accused / Complainant)</th>
                            <th class="py-3 px-3 w-20 border-b border-navy-800 text-center">Section</th>
                            <th class="py-3 px-3 w-28 border-b border-navy-800 text-center">Stage</th>
                            <th class="py-3 px-3 w-28 border-b border-navy-800 text-center font-bold text-gold-500">Next Date</th>
                            <th class="py-3 px-3 w-24 text-center border-b border-navy-800 no-print">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="causeListTableBody" class="divide-y divide-slate-200 bg-white">
